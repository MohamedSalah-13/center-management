# اختبارات هذه الوحدة على H2 في الذاكرة، بلا قاعدة ولا حاوية - تماماً كاختبارات
# center-app. وهذا الملف يحجب application.properties الرئيسي بالكامل (نفس الاسم
# في classpath)، فما تحقنه الخدمات بـ @Value يجب أن يُعرَّف هنا أيضاً.
spring.datasource.url=jdbc:h2:mem:webtestdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ملفات الترحيل مكتوبة بلهجة MySQL؛ المخطط هنا يبنيه Hibernate من الكيانات
spring.flyway.enabled=false

# تعدّدية المؤسسات مطفأة: الاختبار يقيس الحافة لا التوجيه، وSchemaRoutingTest
# في center-app هو من يقيس التوجيه
center.tenancy.enabled=false

center.backup.root=
center.backup.mysql-bin-dir=

# الكوكي بلا Secure في الاختبار: MockMvc لا يتكلم https، وكوكي Secure لا يُحفظ
server.servlet.session.cookie.secure=false
