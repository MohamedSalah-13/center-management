# ==========================================================================
# إعدادات خادم الويب.
#
# لا قيمة سرّية هنا، والملف متتبَّع في git: كل ما هو سرّ يُقرأ من البيئة - كلمة
# مرور القاعدة هنا، وكلمة تشفير النسخ ورمز المراسلة في EnvironmentSecrets. وهو
# الفرق عن الجهاز: هناك سجلّ ويندوز يخصّ مستخدماً واحداً، وهنا صورةُ نشرٍ تُبنى
# مرة وتعمل في أماكن مختلفة بأسرار مختلفة.
# ==========================================================================

server.port=${PORT:8080}

# sslMode=REQUIRED لا PREFERRED: هنا القاعدة على الطرف الآخر من شبكة بالضرورة،
# وPREFERRED تقبل الاتصال الصريح بصمت إن لم يعرض الخادم تشفيراً
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/center_db?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:center_app}

# بلا قيمة افتراضية: متغيّر غير مضبوط يُسقط الإقلاع برسالة تسمّيه، لا برسالة
# رفض وصول من MySQL تُقرأ على أنها كلمة مرور خاطئة
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# open-in-view مطفأة صراحةً: الافتراضي يُبقي جلسة Hibernate مفتوحة طوال الطلب،
# فيُحمَّل ما هو كسول أثناء تحويل الجواب إلى JSON. والنتيجة استعلامٌ لكل حقل يلمسه
# المسلسِل، وعلاقاتٌ تُسحب إلى الجواب لم يقصدها أحد. الحافة هنا تنسخ الصفوف إلى
# سجلّات صغيرة أصلاً، وإطفاؤها يجعل نسيان النسخ عطلاً صاخباً لا استعلاماً صامتاً

# Flyway على قاعدة السنتر الواحد. وحين تُشغَّل تعدّدية المؤسسات تتولى
# TenantMigrations الترحيل لكل قاعدة، وتُطفأ هذه
spring.flyway.enabled=${CENTER_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# تعدّدية المؤسسات مطفأة افتراضاً، كما على الجهاز: خادمٌ لسنتر واحد هو نشرٌ
# حقيقي - شاشات على شبكة السنتر - لا حالة اختبارية
center.tenancy.enabled=${CENTER_TENANCY_ENABLED:false}

# جذر النسخ الاحتياطية على هذا الخادم؛ فارغٌ يعني بلا حدّ. راجع ContainedPath
center.backup.root=${CENTER_BACKUP_ROOT:}
center.backup.mysql-bin-dir=${CENTER_BACKUP_MYSQL_BIN_DIR:}

# الجلسة على كوكي: HttpOnly حتى لا يقرأها JS، وSameSite=Lax حتى لا تُرسَل مع
# طلبٍ يبدأه موقع آخر. ورمز CSRF عمداً ليس HttpOnly - الواجهة تقرؤه لتعيده في
# ترويسة، وهو ما لا يستطيعه نطاقٌ آخر
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=${CENTER_COOKIE_SECURE:true}
server.servlet.session.timeout=8h

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
