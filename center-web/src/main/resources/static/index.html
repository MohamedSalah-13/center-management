<!DOCTYPE html>
<!--
  صفحةٌ واحدة بلا أدوات بناء: لا npm ولا حزم تُجمَّع.

  السبب هو نفسه الذي جعل نغمة التنبيه تُولَّد ولا تُشحن ملفاً، وأيقونةَ اللوحة
  تُرسَم في الكود: مشروعٌ يُبنى بأمر mvn واحد ويُشحن بلا خطوة ثانية. وحزمةُ
  واجهةٍ تعني أمراً ثانياً في CI، ومجلّد node_modules، وترقياتٍ أسبوعية لأجل ثلاث
  شاشات لا تحتاجها.

  ولا نصّ عربياً هنا: كل ما يُقرأ يأتي من /api/messages بلغة الطلب - نفس قاعدة
  "لا نصّ يراه المستخدم في كود" المكتوبة لملفات FXML.
-->
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-text="web.app.title"></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="signIn" class="screen centred">
    <form class="card" id="loginForm" autocomplete="on">
        <h1 data-text="web.login.title"></h1>

        <label data-text="web.login.centre" for="centre"></label>
        <input id="centre" name="centre" autocomplete="organization">
        <p class="hint" data-text="web.login.centreHint"></p>

        <label data-text="web.login.username" for="username"></label>
        <input id="username" name="username" autocomplete="username" required>

        <label data-text="web.login.password" for="password"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" data-text="web.login.submit"></button>
        <p class="error" id="loginError"></p>
    </form>
</div>

<div id="setUp" class="screen centred hidden">
    <form class="card" id="setupForm" autocomplete="off">
        <h1 data-text="web.setup.title"></h1>
        <p class="hint" data-text="web.setup.description"></p>

        <p class="hint" data-text="web.setup.usernameLine"></p>

        <label data-text="web.setup.token" for="setupToken"></label>
        <input id="setupToken" type="password" autocomplete="off" required>
        <p class="hint" data-text="web.setup.tokenHint"></p>

        <label data-text="web.setup.password" for="setupPassword"></label>
        <input id="setupPassword" type="password" autocomplete="new-password" required>

        <label data-text="web.setup.confirm" for="setupConfirm"></label>
        <input id="setupConfirm" type="password" autocomplete="new-password" required>

        <button type="submit" data-text="web.setup.submit"></button>
        <p class="error" id="setupError"></p>
    </form>
</div>

<div id="app" class="screen hidden">
    <header>
        <strong data-text="web.app.title"></strong>
        <nav>
            <button data-view="day" data-text="web.nav.day"></button>
            <button data-view="attendance" data-text="web.nav.attendance"></button>
            <button data-view="till" data-text="web.nav.till"></button>
            <button data-view="students" data-text="web.nav.students"></button>
            <button data-view="groups" data-text="web.nav.groups"></button>
            <button data-view="finance" data-text="web.nav.finance"></button>
            <button data-view="admin" data-text="web.nav.admin"></button>
            <button data-view="alerts" data-text="web.nav.alerts"></button>
            <button data-view="reports" data-text="web.nav.reports"></button>
        </nav>
        <span class="spacer"></span>
        <span id="alertCount" class="badge" hidden></span>
        <span id="who"></span>
        <button id="signOut" class="link" data-text="web.signOut"></button>
    </header>

    <p class="error" id="appError"></p>

    <section id="view-attendance" class="view">
        <h2 data-text="web.attendance.title"></h2>
        <form id="scanForm" class="row">
            <label data-text="web.attendance.session" for="sessionId"></label>
            <select id="sessionId"></select>
            <label data-text="web.attendance.barcode" for="barcode"></label>
            <input id="barcode" autocomplete="off">
            <button type="submit" data-text="web.nav.attendance"></button>
        </form>
        <p id="scanResult" class="result"></p>
        <table id="attendanceTable"></table>
    </section>

    <section id="view-day" class="view hidden">
        <h2 data-text="web.day.title"></h2>
        <form id="dayForm" class="row">
            <label data-text="web.common.date" for="dayDate"></label>
            <input id="dayDate" type="date">
            <button type="submit" data-text="web.common.refresh"></button>
        </form>
        <p id="dayBrief" class="result"></p>
        <p id="dayNext" class="result"></p>
        <table id="dayTable"></table>

        <h3 data-text="web.sessions.title"></h3>
        <form id="openSessionForm" class="row">
            <label data-text="web.sessions.group" for="sessionGroup"></label>
            <select id="sessionGroup"></select>
            <label data-text="web.sessions.date" for="sessionDate"></label>
            <input id="sessionDate" type="date">
            <button type="submit" data-text="web.sessions.open"></button>
        </form>
        <p id="sessionResult" class="result"></p>
        <form id="sessionFilterForm" class="row">
            <label><input id="openOnly" type="checkbox" checked> <span data-text="web.sessions.openOnly"></span></label>
            <button type="submit" data-text="web.common.refresh"></button>
        </form>
        <table id="sessionTable"></table>
    </section>

    <section id="view-till" class="view hidden">
        <h2 data-text="web.till.title"></h2>
        <form id="payForm" class="row">
            <label data-text="web.till.barcode" for="payBarcode"></label>
            <input id="payBarcode" autocomplete="off">
            <button type="button" id="loadEnrolments" data-text="web.till.load"></button>
            <label data-text="web.till.group" for="payGroup"></label>
            <select id="payGroup"></select>
            <label data-text="web.till.amount" for="payAmount"></label>
            <input id="payAmount" type="number" step="0.01" min="0">
            <label data-text="web.till.description" for="payDescription"></label>
            <input id="payDescription">
            <button type="submit" data-text="web.till.collect"></button>
        </form>

        <form id="expenseForm" class="row">
            <strong data-text="web.till.expenseTitle"></strong>
            <label data-text="web.till.amount" for="expenseAmount"></label>
            <input id="expenseAmount" type="number" step="0.01" min="0">
            <label data-text="web.till.description" for="expenseDescription"></label>
            <input id="expenseDescription">
            <button type="submit" data-text="web.till.record"></button>
        </form>

        <p id="tillResult" class="result"></p>

        <h3 data-text="web.till.dayTitle"></h3>
        <form id="tillDayForm" class="row">
            <label data-text="web.common.date" for="tillDate"></label>
            <input id="tillDate" type="date">
            <button type="submit" data-text="web.common.refresh"></button>
        </form>
        <p id="tillSummary" class="result"></p>
        <table id="tillTable"></table>
    </section>

    <section id="view-students" class="view hidden">
        <h2 data-text="web.students.title"></h2>

        <form id="studentEditForm" class="row">
            <strong data-text="web.students.formTitle"></strong>
            <input id="studentId" type="hidden">
            <input id="studentLevelBefore" type="hidden">
            <label data-text="web.students.name" for="studentName"></label>
            <input id="studentName" required>
            <label data-text="web.students.barcode" for="studentBarcode"></label>
            <input id="studentBarcode" autocomplete="off">
            <label data-text="web.students.phone" for="studentPhone"></label>
            <input id="studentPhone" autocomplete="off">
            <label data-text="web.students.parentPhone" for="studentParentPhone"></label>
            <input id="studentParentPhone" autocomplete="off">
            <label data-text="web.students.level" for="studentLevel"></label>
            <select id="studentLevel"></select>
            <button type="submit" data-text="web.students.save"></button>
            <button type="button" id="studentClear" data-text="web.students.new"></button>
            <p class="hint" data-text="web.students.barcodeHint"></p>
        </form>
        <p id="studentResult" class="result"></p>

        <form id="studentForm" class="row">
            <input id="studentQuery" data-placeholder="web.students.search">
            <label><input id="includeArchived" type="checkbox"> <span data-text="web.students.includeArchived"></span></label>
            <button type="submit" data-text="web.common.refresh"></button>
        </form>
        <table id="studentTable"></table>

        <h3 data-text="web.enrolments.title"></h3>
        <p id="enrolmentSubject" class="result"></p>
        <form id="enrolForm" class="row">
            <label data-text="web.enrolments.group" for="enrolGroup"></label>
            <select id="enrolGroup"></select>
            <button type="submit" data-text="web.enrolments.enrol"></button>
        </form>
        <p id="enrolResult" class="result"></p>
        <table id="enrolmentTable"></table>

        <h3 data-text="web.payments.title"></h3>
        <p id="paymentSummary" class="result"></p>
        <table id="paymentTable"></table>
    </section>

    <section id="view-groups" class="view hidden">
        <h2 data-text="web.groups.title"></h2>

        <form id="groupEditForm" class="row">
            <strong data-text="web.groups.formTitle"></strong>
            <input id="groupId" type="hidden">
            <label data-text="web.groups.teacher" for="groupTeacher"></label>
            <select id="groupTeacher"></select>
            <label data-text="web.groups.level" for="groupLevel"></label>
            <select id="groupLevel"></select>
            <label data-text="web.groups.capacity" for="groupCapacity"></label>
            <input id="groupCapacity" type="number" min="1" step="1">
            <label data-text="web.groups.price" for="groupPrice"></label>
            <input id="groupPrice" type="number" min="0" step="0.01">
            <label data-text="web.groups.start" for="groupStart"></label>
            <input id="groupStart" type="time">
            <label data-text="web.groups.end" for="groupEnd"></label>
            <input id="groupEnd" type="time">
            <span data-text="web.groups.days"></span>
            <span id="groupDays" class="days"></span>
            <label><input id="groupCustomName" type="checkbox"> <span data-text="web.groups.customName"></span></label>
            <input id="groupName" data-placeholder="web.groups.name" disabled>
            <button type="submit" data-text="web.groups.save"></button>
            <button type="button" id="groupClear" data-text="web.groups.new"></button>
            <p class="hint" data-text="web.groups.nameHint"></p>
        </form>
        <p id="groupResult" class="result"></p>

        <table id="groupTable"></table>

        <h3 id="rosterTitle"></h3>
        <table id="rosterTable"></table>
    </section>

    <section id="view-finance" class="view hidden">
        <h2 data-text="web.expenses.title"></h2>
        <form id="expenseReportForm" class="row">
            <label data-text="web.reports.from" for="expenseFrom"></label>
            <input id="expenseFrom" type="date">
            <label data-text="web.reports.to" for="expenseTo"></label>
            <input id="expenseTo" type="date">
            <input id="expenseQuery" data-placeholder="web.expenses.search">
            <button type="submit" data-text="web.common.refresh"></button>
            <a id="expensesPdf" href="#" target="_blank" rel="noopener" data-text="web.expenses.pdf"></a>
        </form>
        <p id="expenseSummary" class="result"></p>
        <table id="expenseTable"></table>

        <h3 data-text="web.payouts.title"></h3>
        <form id="payoutForm" class="row">
            <label data-text="web.payouts.teacher" for="payoutTeacher"></label>
            <select id="payoutTeacher"></select>
            <button type="submit" data-text="web.common.refresh"></button>
            <a id="statementPdf" href="#" target="_blank" rel="noopener" data-text="web.payouts.statement"></a>
        </form>
        <p id="payoutResult" class="result"></p>
        <table id="payoutTable"></table>
    </section>

    <section id="view-admin" class="view hidden">
        <h2 data-text="web.settings.title"></h2>
        <form id="settingsForm" class="row">
            <label data-text="web.settings.centerName" for="setCenterName"></label>
            <input id="setCenterName">
            <label data-text="web.settings.centerPhone" for="setCenterPhone"></label>
            <input id="setCenterPhone">
            <label data-text="web.settings.currency" for="setCurrency"></label>
            <select id="setCurrency"></select>
            <label data-text="web.settings.logoPath" for="setLogoPath"></label>
            <input id="setLogoPath">
            <label data-text="web.settings.ledgerStart" for="setLedgerStart"></label>
            <input id="setLedgerStart" type="date">

            <label><input id="setAutoBackup" type="checkbox"> <span data-text="web.settings.autoBackup"></span></label>
            <label data-text="web.settings.backupPath" for="setBackupPath"></label>
            <input id="setBackupPath">
            <label data-text="web.settings.backupFrequency" for="setBackupFrequency"></label>
            <select id="setBackupFrequency"></select>
            <label data-text="web.settings.backupTime" for="setBackupTime"></label>
            <input id="setBackupTime" type="time">
            <label data-text="web.settings.backupRetention" for="setBackupRetention"></label>
            <input id="setBackupRetention" type="number" min="0" step="1">

            <label data-text="web.settings.channel" for="setChannel"></label>
            <select id="setChannel"></select>
            <label data-text="web.settings.apiUrl" for="setApiUrl"></label>
            <input id="setApiUrl">
            <label data-text="web.settings.senderId" for="setSenderId"></label>
            <input id="setSenderId">
            <label data-text="web.settings.templateName" for="setTemplateName"></label>
            <input id="setTemplateName">
            <label data-text="web.settings.templateLanguage" for="setTemplateLanguage"></label>
            <input id="setTemplateLanguage">
            <label data-text="web.settings.bodyTemplate" for="setBodyTemplate"></label>
            <input id="setBodyTemplate">

            <button type="submit" data-text="web.settings.save"></button>
            <p class="hint" data-text="web.settings.secretsHint"></p>
        </form>
        <p id="settingsState" class="result"></p>
        <p class="hint" data-text="web.settings.stateHint"></p>
        <p id="settingsResult" class="result"></p>

        <h3 data-text="web.teachers.title"></h3>
        <form id="teacherForm" class="row">
            <input id="teacherId" type="hidden">
            <label data-text="web.teachers.name" for="teacherName"></label>
            <input id="teacherName" required>
            <label data-text="web.teachers.subject" for="teacherSubject"></label>
            <input id="teacherSubject">
            <label data-text="web.teachers.commissionType" for="teacherCommissionType"></label>
            <select id="teacherCommissionType"></select>
            <label data-text="web.teachers.commissionValue" for="teacherCommissionValue"></label>
            <input id="teacherCommissionValue" type="number" min="0" step="0.01">
            <button type="submit" data-text="web.teachers.save"></button>
            <button type="button" id="teacherClear" data-text="web.teachers.new"></button>
        </form>
        <p id="teacherResult" class="result"></p>
        <table id="teacherTable"></table>

        <h3 data-text="web.users.title"></h3>
        <form id="userForm" class="row">
            <input id="userId" type="hidden">
            <label data-text="web.users.username" for="userName"></label>
            <input id="userName" autocomplete="off" required>
            <label data-text="web.users.role" for="userRole"></label>
            <select id="userRole"></select>
            <label data-text="web.users.password" for="userPassword"></label>
            <input id="userPassword" type="password" autocomplete="new-password">
            <label data-text="web.users.confirmation" for="userConfirmation"></label>
            <input id="userConfirmation" type="password" autocomplete="new-password">
            <button type="submit" data-text="web.users.save"></button>
            <button type="button" id="userClear" data-text="web.users.new"></button>
            <p class="hint" data-text="web.users.passwordHint"></p>
        </form>
        <p id="userResult" class="result"></p>
        <table id="userTable"></table>

        <h3 data-text="web.audit.title"></h3>
        <form id="auditForm" class="row">
            <label data-text="web.reports.from" for="auditFrom"></label>
            <input id="auditFrom" type="date">
            <label data-text="web.reports.to" for="auditTo"></label>
            <input id="auditTo" type="date">
            <label data-text="web.audit.actor" for="auditActor"></label>
            <select id="auditActor"></select>
            <label data-text="web.audit.category" for="auditCategory"></label>
            <select id="auditCategory"></select>
            <button type="submit" data-text="web.common.refresh"></button>
        </form>
        <p id="auditSummary" class="result"></p>
        <table id="auditTable"></table>
    </section>

    <section id="view-alerts" class="view hidden">
        <h2 data-text="web.alerts.inbox"></h2>
        <form id="alertForm" class="row">
            <label data-text="web.reports.from" for="alertFrom"></label>
            <input id="alertFrom" type="date">
            <label data-text="web.reports.to" for="alertTo"></label>
            <input id="alertTo" type="date">
            <label data-text="web.alerts.category" for="alertCategory"></label>
            <select id="alertCategory"></select>
            <label data-text="web.alerts.severity" for="alertSeverity"></label>
            <select id="alertSeverity"></select>
            <label><input id="alertOpenOnly" type="checkbox" checked> <span data-text="web.alerts.openOnly"></span></label>
            <button type="submit" data-text="web.common.refresh"></button>
            <button type="button" id="alertScan" data-text="web.alerts.scanNow"></button>
        </form>
        <p id="alertSummary" class="result"></p>
        <table id="alertTable"></table>

        <form id="scanSettingsForm" class="row">
            <label><input id="scanEnabled" type="checkbox"> <span data-text="web.alerts.masterSwitch"></span></label>
            <label data-text="web.alerts.scanTime" for="scanTime"></label>
            <input id="scanTime" type="time">
            <button type="submit" data-text="web.alerts.saveScan"></button>
        </form>
        <p id="scanState" class="result"></p>
        <p class="hint" data-text="web.alerts.scanNote"></p>

        <h3 data-text="web.rules.title"></h3>
        <p id="ruleSummary" class="result"></p>
        <table id="ruleTable"></table>
        <form id="ruleForm" class="row hidden">
            <strong id="ruleSubject"></strong>
            <p id="ruleDescription" class="hint"></p>
            <label><input id="ruleEnabled" type="checkbox"> <span data-text="web.rules.enabled"></span></label>
            <label data-text="web.rules.audience" for="ruleAudience"></label>
            <select id="ruleAudience"></select>
            <label data-text="web.rules.severity" for="ruleSeverity"></label>
            <select id="ruleSeverity"></select>
            <label id="ruleThresholdLabel" for="ruleThreshold"></label>
            <input id="ruleThreshold" type="number" min="0" step="1">
            <label id="ruleWindowLabel" for="ruleWindow"></label>
            <input id="ruleWindow" type="number" min="1" step="1">
            <label id="ruleCooldownLabel" data-text="web.rules.cooldown" for="ruleCooldown"></label>
            <input id="ruleCooldown" type="number" min="0" step="1">
            <p id="ruleAudienceNote" class="hint"></p>
            <button type="submit" data-text="web.rules.save"></button>
            <button type="button" id="ruleCancel" data-text="web.rules.cancel"></button>
        </form>
        <p id="ruleResult" class="result"></p>

        <h3 data-text="web.notify.title"></h3>
        <p id="notifyChannel" class="hint"></p>
        <form id="notifyForm" class="row">
            <label data-text="web.notify.type" for="notifyType"></label>
            <select id="notifyType"></select>
            <label data-text="web.notify.group" for="notifyGroup"></label>
            <select id="notifyGroup"></select>
            <label data-text="web.reports.from" for="notifyFrom"></label>
            <input id="notifyFrom" type="date">
            <label data-text="web.reports.to" for="notifyTo"></label>
            <input id="notifyTo" type="date">
            <button type="submit" data-text="web.notify.build"></button>
        </form>
        <p id="notifySummary" class="result"></p>
        <table id="notifyTable"></table>
        <p id="notifyResult" class="result"></p>
        <p id="notifyHandOff" class="result"></p>

        <h4 data-text="web.notify.logTitle"></h4>
        <table id="notifyLogTable"></table>
    </section>

    <section id="view-reports" class="view hidden">
        <h2 data-text="web.reports.title"></h2>
        <form id="reportForm" class="row">
            <label data-text="web.reports.from" for="reportFrom"></label>
            <input id="reportFrom" type="date">
            <label data-text="web.reports.to" for="reportTo"></label>
            <input id="reportTo" type="date">
        </form>
        <ul class="reports">
            <li><a id="arrearsPdf" href="#" target="_blank" rel="noopener" data-text="web.reports.arrears"></a></li>
            <li><a id="shiftPdf" href="#" target="_blank" rel="noopener" data-text="web.reports.shift"></a></li>
            <li><a id="attendanceLogPdf" href="#" target="_blank" rel="noopener" data-text="web.reports.attendanceLog"></a></li>
        </ul>
    </section>

    <aside id="alerts">
        <h3 data-text="web.alerts.title"></h3>
        <ul id="alertList"></ul>
    </aside>
</div>

<script src="app.js"></script>
</body>
</html>
