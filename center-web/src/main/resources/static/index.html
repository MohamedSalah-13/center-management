<!DOCTYPE html>
<!--
  صفحةٌ واحدة بلا أدوات بناء: لا npm ولا حزم تُجمَّع.

  السبب هو نفسه الذي جعل نغمة التنبيه تُولَّد ولا تُشحن ملفاً، وأيقونةَ اللوحة
  تُرسَم في الكود: مشروعٌ يُبنى بأمر mvn واحد ويُشحن بلا خطوة ثانية. وحزمةُ
  واجهةٍ تعني أمراً ثانياً في CI، ومجلّد node_modules، وترقياتٍ أسبوعية لأجل ثلاث
  شاشات لا تحتاجها.

  ولا نصّ عربياً هنا: كل ما يُقرأ يأتي من /api/messages بلغة الطلب - نفس قاعدة
  "لا نصّ يراه المستخدم في كود" المكتوبة لملفات FXML.
-->
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title data-text="web.app.title"></title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div id="signIn" class="screen centred">
            <form class="card" id="loginForm" autocomplete="on">
                <h1 data-text="web.login.title"></h1>

                <label data-text="web.login.centre" for="centre"></label>
                <input id="centre" name="centre" autocomplete="organization">
                <p class="hint" data-text="web.login.centreHint"></p>

                <label data-text="web.login.username" for="username"></label>
                <input id="username" name="username" autocomplete="username" required>

                <label data-text="web.login.password" for="password"></label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit" data-text="web.login.submit"></button>
                <p class="error" id="loginError"></p>
            </form>
        </div>

        <div id="setUp" class="screen centred hidden">
            <form class="card" id="setupForm" autocomplete="off">
                <h1 data-text="web.setup.title"></h1>
                <p class="hint" data-text="web.setup.description"></p>

                <p class="hint" data-text="web.setup.usernameLine"></p>

                <label data-text="web.setup.token" for="setupToken"></label>
                <input id="setupToken" type="password" autocomplete="off" required>
                <p class="hint" data-text="web.setup.tokenHint"></p>

                <label data-text="web.setup.password" for="setupPassword"></label>
                <input id="setupPassword" type="password" autocomplete="new-password" required>

                <label data-text="web.setup.confirm" for="setupConfirm"></label>
                <input id="setupConfirm" type="password" autocomplete="new-password" required>

                <button type="submit" data-text="web.setup.submit"></button>
                <p class="error" id="setupError"></p>
            </form>
        </div>

        <div id="app" class="screen hidden">
            <header>
                <strong data-text="web.app.title"></strong>
                <nav>
                    <button data-view="day" data-text="web.nav.day"></button>
                    <button data-view="attendance" data-text="web.nav.attendance"></button>
                    <button data-admin-only data-view="till" data-text="web.nav.till"></button>
                    <button data-view="students" data-text="web.nav.students"></button>
                    <button data-admin-only data-view="groups" data-text="web.nav.groups"></button>
                    <button data-admin-only data-view="finance" data-text="web.nav.finance"></button>
                    <button data-admin-only data-view="admin" data-text="web.nav.admin"></button>
                    <button data-admin-only data-view="alerts" data-text="web.nav.alerts"></button>
                    <button data-view="reports" data-text="web.nav.reports"></button>
                </nav>
                <span class="spacer"></span>
                <span id="alertCount" class="badge" hidden></span>
                <span id="who"></span>
                <button id="signOut" class="link" data-text="web.signOut"></button>
            </header>

            <p class="error" id="appError"></p>

            <section id="view-attendance" class="view">
                <h2 data-text="web.attendance.title"></h2>
                <p class="view-description" data-text="web.ui.attendanceHint"></p>
                <form id="scanForm" class="data-form">
                    <div class="form-field">
                        <label data-text="web.attendance.session" for="sessionId"></label>
                        <select id="sessionId"></select>
                    </div>
                    <div class="form-field">
                        <label data-text="web.attendance.barcode" for="barcode"></label>
                        <input id="barcode" autocomplete="off">
                    </div>
                    <div class="form-actions">
                        <button type="submit" data-text="web.nav.attendance"></button>
                    </div>
                </form>
                <p id="scanResult" class="result"></p>
                <div class="table-scroll" tabindex="0"><table id="attendanceTable"></table></div>
            </section>

            <section id="view-day" class="view hidden">
                <h2 data-text="web.day.title"></h2>
                <p class="view-description" data-text="web.ui.dayHint"></p>
                <div class="section-tabs" role="tablist" data-tabs="day">
                    <button type="button" role="tab" id="tab-day-schedule" aria-controls="panel-day-schedule" aria-selected="true" tabindex="0" data-panel="schedule" data-text="web.day.title"></button>
                    <button type="button" role="tab" id="tab-day-sessions" aria-controls="panel-day-sessions" aria-selected="false" tabindex="-1" data-panel="sessions" data-text="web.sessions.title"></button>
                </div>

                <div id="panel-day-schedule" role="tabpanel" aria-labelledby="tab-day-schedule" data-panel-group="day" data-panel-name="schedule">
                    <form id="dayForm" class="filter-form">
                        <div class="form-field">
                            <label data-text="web.common.date" for="dayDate"></label>
                            <input id="dayDate" type="date">
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.common.refresh"></button>
                        </div>
                    </form>
                    <p id="dayBrief" class="result"></p>
                    <p id="dayNext" class="result"></p>
                    <div class="table-scroll" tabindex="0"><table id="dayTable"></table></div>

                </div>

                <div id="panel-day-sessions" role="tabpanel" aria-labelledby="tab-day-sessions" data-panel-group="day" data-panel-name="sessions" class="hidden">
                    <h3 data-text="web.sessions.title"></h3>
                    <form id="openSessionForm" class="data-form">
                        <div class="form-field">
                            <label data-text="web.sessions.group" for="sessionGroup"></label>
                            <select id="sessionGroup"></select>
                        </div>
                        <div class="form-field">
                            <label data-text="web.sessions.date" for="sessionDate"></label>
                            <input id="sessionDate" type="date">
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.sessions.open"></button>
                        </div>
                    </form>
                    <p id="sessionResult" class="result"></p>
                    <form id="sessionFilterForm" class="filter-form">
                        <label><input id="openOnly" type="checkbox" checked> <span data-text="web.sessions.openOnly"></span></label>
                        <div class="form-actions">
                            <button type="submit" data-text="web.common.refresh"></button>
                        </div>
                    </form>
                    <div class="table-scroll" tabindex="0"><table id="sessionTable"></table></div>
                </div>
            </section>

            <section id="view-till" class="view hidden">
                <h2 data-text="web.till.title"></h2>
                <p class="view-description" data-text="web.ui.tillHint"></p>
                <p id="tillResult" class="result"></p>
                <div class="section-tabs" role="tablist" data-tabs="till">
                    <button type="button" role="tab" id="tab-till-payment" aria-controls="panel-till-payment" aria-selected="true" tabindex="0" data-panel="payment" data-text="web.till.collect"></button>
                    <button type="button" role="tab" id="tab-till-expense" aria-controls="panel-till-expense" aria-selected="false" tabindex="-1" data-panel="expense" data-text="web.till.expenseTitle"></button>
                    <button type="button" role="tab" id="tab-till-movements" aria-controls="panel-till-movements" aria-selected="false" tabindex="-1" data-panel="movements" data-text="web.till.dayTitle"></button>
                </div>

                <div id="panel-till-payment" role="tabpanel" aria-labelledby="tab-till-payment" data-panel-group="till" data-panel-name="payment">
                    <form id="payForm" class="data-form">
                        <div class="form-field">
                            <label data-text="web.till.barcode" for="payBarcode"></label>
                            <input id="payBarcode" autocomplete="off">
                        </div>
                        <div class="form-actions">
                            <button type="button" id="loadEnrolments" data-text="web.till.load"></button>
                        </div>
                        <div class="form-field">
                            <label data-text="web.till.group" for="payGroup"></label>
                            <select id="payGroup"></select>
                        </div>
                        <div class="form-field">
                            <label data-text="web.till.amount" for="payAmount"></label>
                            <input id="payAmount" type="number" step="0.01" min="0">
                        </div>
                        <div class="form-field">
                            <label data-text="web.till.description" for="payDescription"></label>
                            <input id="payDescription">
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.till.collect"></button>
                        </div>
                    </form>

                </div>

                <div id="panel-till-expense" role="tabpanel" aria-labelledby="tab-till-expense" data-panel-group="till" data-panel-name="expense" class="hidden">
                    <form id="expenseForm" class="data-form">
                        <strong data-text="web.till.expenseTitle"></strong>
                        <div class="form-field">
                            <label data-text="web.till.amount" for="expenseAmount"></label>
                            <input id="expenseAmount" type="number" step="0.01" min="0">
                        </div>
                        <div class="form-field">
                            <label data-text="web.till.description" for="expenseDescription"></label>
                            <input id="expenseDescription">
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.till.record"></button>
                        </div>
                    </form>


                </div>

                <div id="panel-till-movements" role="tabpanel" aria-labelledby="tab-till-movements" data-panel-group="till" data-panel-name="movements" class="hidden">
                    <h3 data-text="web.till.dayTitle"></h3>
                    <form id="tillDayForm" class="filter-form">
                        <div class="form-field">
                            <label data-text="web.common.date" for="tillDate"></label>
                            <input id="tillDate" type="date">
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.common.refresh"></button>
                        </div>
                    </form>
                    <p id="tillSummary" class="result"></p>
                    <div class="table-scroll" tabindex="0"><table id="tillTable"></table></div>
                </div>
            </section>

            <section id="view-students" class="view hidden">
                <h2 data-text="web.students.title"></h2>
                <p class="view-description" data-text="web.ui.studentsHint"></p>
                <p id="studentResult" class="result"></p>
                <div class="section-tabs" role="tablist" data-tabs="students">
                    <button type="button" role="tab" id="tab-students-list" aria-controls="panel-students-list" aria-selected="true" tabindex="0" data-panel="list" data-text="web.tabs.studentList"></button>
                    <button type="button" role="tab" id="tab-students-edit" aria-controls="panel-students-edit" aria-selected="false" tabindex="-1" data-panel="edit" data-text="web.students.formTitle"></button>
                    <button type="button" role="tab" id="tab-students-enrolments" aria-controls="panel-students-enrolments" aria-selected="false" tabindex="-1" data-panel="enrolments" data-text="web.enrolments.title" disabled></button>
                    <button type="button" role="tab" id="tab-students-payments" aria-controls="panel-students-payments" aria-selected="false" tabindex="-1" data-panel="payments" data-text="web.payments.title" disabled></button>
                </div>

                <div id="panel-students-list" role="tabpanel" aria-labelledby="tab-students-list" data-panel-group="students" data-panel-name="list">
                    <div class="panel-actions"><button type="button" id="studentAdd" data-text="web.students.new"></button></div>
                    <form id="studentForm" class="filter-form">
                        <div class="form-field">
                            <label for="studentQuery" data-text="web.students.search"></label>
                            <input id="studentQuery" data-placeholder="web.students.search">
                        </div>
                        <label><input id="includeArchived" type="checkbox"> <span data-text="web.students.includeArchived"></span></label>
                        <div class="form-actions">
                            <button type="submit" data-text="web.common.refresh"></button>
                        </div>
                    </form>
                    <div class="table-scroll" tabindex="0"><table id="studentTable"></table></div>

                </div>

                <div id="panel-students-edit" role="tabpanel" aria-labelledby="tab-students-edit" data-panel-group="students" data-panel-name="edit" class="hidden">
                    <form id="studentEditForm" class="data-form">
                        <strong data-text="web.students.formTitle"></strong>
                        <input id="studentId" type="hidden">
                        <input id="studentLevelBefore" type="hidden">
                        <div class="form-field">
                            <label data-text="web.students.name" for="studentName"></label>
                            <input id="studentName" required>
                        </div>
                        <div class="form-field">
                            <label data-text="web.students.barcode" for="studentBarcode"></label>
                            <input id="studentBarcode" autocomplete="off">
                        </div>
                        <div class="form-field">
                            <label data-text="web.students.phone" for="studentPhone"></label>
                            <input id="studentPhone" autocomplete="off">
                        </div>
                        <div class="form-field">
                            <label data-text="web.students.parentPhone" for="studentParentPhone"></label>
                            <input id="studentParentPhone" autocomplete="off">
                        </div>
                        <div class="form-field">
                            <label data-text="web.students.level" for="studentLevel"></label>
                            <select id="studentLevel"></select>
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.students.save"></button>
                            <button type="button" id="studentClear" data-text="web.students.new"></button>
                        </div>
                        <p class="hint" data-text="web.students.barcodeHint"></p>
                        <div class="form-actions"><button type="button" class="secondary" data-back="students" data-text="web.ui.backToList"></button></div></form>

                </div>

                <div id="panel-students-enrolments" role="tabpanel" aria-labelledby="tab-students-enrolments" data-panel-group="students" data-panel-name="enrolments" class="hidden">
                    <h3 data-text="web.enrolments.title"></h3>
                    <p id="enrolmentSubject" class="result"></p>
                    <form id="enrolForm" class="data-form">
                        <div class="form-field">
                            <label data-text="web.enrolments.group" for="enrolGroup"></label>
                            <select id="enrolGroup"></select>
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.enrolments.enrol"></button>
                        </div>
                    </form>
                    <p id="enrolResult" class="result"></p>
                    <div class="table-scroll" tabindex="0"><table id="enrolmentTable"></table></div>

                </div>

                <div id="panel-students-payments" role="tabpanel" aria-labelledby="tab-students-payments" data-panel-group="students" data-panel-name="payments" class="hidden">
                    <h3 data-text="web.payments.title"></h3>
                    <p id="paymentSummary" class="result"></p>
                    <div class="table-scroll" tabindex="0"><table id="paymentTable"></table></div>
                </div>
            </section>

            <section id="view-groups" class="view hidden">
                <h2 data-text="web.groups.title"></h2>
                <p class="view-description" data-text="web.ui.groupsHint"></p>
                <p id="groupResult" class="result"></p>
                <div class="section-tabs" role="tablist" data-tabs="groups">
                    <button type="button" role="tab" id="tab-groups-list" aria-controls="panel-groups-list" aria-selected="true" tabindex="0" data-panel="list" data-text="web.tabs.groupList"></button>
                    <button type="button" role="tab" id="tab-groups-edit" aria-controls="panel-groups-edit" aria-selected="false" tabindex="-1" data-panel="edit" data-text="web.groups.formTitle"></button>
                    <button type="button" role="tab" id="tab-groups-roster" aria-controls="panel-groups-roster" aria-selected="false" tabindex="-1" data-panel="roster" data-text="web.groups.roster" disabled></button>
                </div>

                <div id="panel-groups-list" role="tabpanel" aria-labelledby="tab-groups-list" data-panel-group="groups" data-panel-name="list">
                    <div class="panel-actions"><button type="button" id="groupAdd" data-text="web.groups.new"></button></div>
                    <div class="table-scroll" tabindex="0"><table id="groupTable"></table></div>

                </div>

                <div id="panel-groups-edit" role="tabpanel" aria-labelledby="tab-groups-edit" data-panel-group="groups" data-panel-name="edit" class="hidden">
                    <form id="groupEditForm" class="data-form">
                        <strong data-text="web.groups.formTitle"></strong>
                        <input id="groupId" type="hidden">
                        <div class="form-field">
                            <label data-text="web.groups.teacher" for="groupTeacher"></label>
                            <select id="groupTeacher"></select>
                        </div>
                        <div class="form-field">
                            <label data-text="web.groups.level" for="groupLevel"></label>
                            <select id="groupLevel"></select>
                        </div>
                        <div class="form-field">
                            <label data-text="web.groups.capacity" for="groupCapacity"></label>
                            <input id="groupCapacity" type="number" min="1" step="1">
                        </div>
                        <div class="form-field">
                            <label data-text="web.groups.price" for="groupPrice"></label>
                            <input id="groupPrice" type="number" min="0" step="0.01">
                        </div>
                        <div class="form-field">
                            <label data-text="web.groups.start" for="groupStart"></label>
                            <input id="groupStart" type="time">
                        </div>
                        <div class="form-field">
                            <label data-text="web.groups.end" for="groupEnd"></label>
                            <input id="groupEnd" type="time">
                        </div>
                        <div class="form-field full-width"><span data-text="web.groups.days"></span>
                            <span id="groupDays" class="days"></span></div>
                        <label><input id="groupCustomName" type="checkbox"> <span data-text="web.groups.customName"></span></label>
                        <div class="form-field">
                            <label for="groupName" data-text="web.groups.name"></label>
                            <input id="groupName" data-placeholder="web.groups.name" disabled>
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.groups.save"></button>
                            <button type="button" id="groupClear" data-text="web.groups.new"></button>
                        </div>
                        <p class="hint" data-text="web.groups.nameHint"></p>
                        <div class="form-actions"><button type="button" class="secondary" data-back="groups" data-text="web.ui.backToList"></button></div></form>

                </div>

                <div id="panel-groups-roster" role="tabpanel" aria-labelledby="tab-groups-roster" data-panel-group="groups" data-panel-name="roster" class="hidden">
                    <h3 id="rosterTitle"></h3>
                    <div class="table-scroll" tabindex="0"><table id="rosterTable"></table></div>
                </div>
            </section>

            <section id="view-finance" class="view hidden">
                <h2 data-text="web.nav.finance"></h2>
                <p class="view-description" data-text="web.ui.financeHint"></p>
                <div class="section-tabs" role="tablist" data-tabs="finance">
                    <button type="button" role="tab" id="tab-finance-expenses" aria-controls="panel-finance-expenses" aria-selected="true" tabindex="0" data-panel="expenses" data-text="web.expenses.title"></button>
                    <button type="button" role="tab" id="tab-finance-payouts" aria-controls="panel-finance-payouts" aria-selected="false" tabindex="-1" data-panel="payouts" data-text="web.payouts.title"></button>
                </div>

                <div id="panel-finance-expenses" role="tabpanel" aria-labelledby="tab-finance-expenses" data-panel-group="finance" data-panel-name="expenses">
                    <form id="expenseReportForm" class="filter-form">
                        <div class="form-field">
                            <label data-text="web.reports.from" for="expenseFrom"></label>
                            <input id="expenseFrom" type="date">
                        </div>
                        <div class="form-field">
                            <label data-text="web.reports.to" for="expenseTo"></label>
                            <input id="expenseTo" type="date">
                        </div>
                        <div class="form-field">
                            <label for="expenseQuery" data-text="web.expenses.search"></label>
                            <input id="expenseQuery" data-placeholder="web.expenses.search">
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.common.refresh"></button>
                            <a id="expensesPdf" href="#" target="_blank" rel="noopener" data-text="web.expenses.pdf"></a>
                        </div>
                    </form>
                    <p id="expenseSummary" class="result"></p>
                    <div class="table-scroll" tabindex="0"><table id="expenseTable"></table></div>

                </div>

                <div id="panel-finance-payouts" role="tabpanel" aria-labelledby="tab-finance-payouts" data-panel-group="finance" data-panel-name="payouts" class="hidden">
                    <h3 data-text="web.payouts.title"></h3>
                    <form id="payoutForm" class="filter-form">
                        <div class="form-field">
                            <label data-text="web.payouts.teacher" for="payoutTeacher"></label>
                            <select id="payoutTeacher"></select>
                        </div>
                        <div class="form-actions">
                            <button type="submit" data-text="web.common.refresh"></button>
                            <a id="statementPdf" href="#" target="_blank" rel="noopener" data-text="web.payouts.statement"></a>
                        </div>
                    </form>
                    <p id="payoutResult" class="result"></p>
                    <div class="table-scroll" tabindex="0"><table id="payoutTable"></table></div>
                </div>
            </section>

            <section id="view-admin" class="view hidden">
                <h2 data-text="web.nav.admin"></h2>
                <p class="view-description" data-text="web.ui.adminHint"></p>
                <div class="section-tabs" role="tablist" data-tabs="admin">
                    <button type="button" role="tab" id="tab-admin-settings" aria-controls="panel-admin-settings" aria-selected="true" tabindex="0" data-panel="settings" data-text="web.settings.title"></button>
                    <button type="button" role="tab" id="tab-admin-teachers" aria-controls="panel-admin-teachers" aria-selected="false" tabindex="-1" data-panel="teachers" data-text="web.teachers.title"></button>
                    <button type="button" role="tab" id="tab-admin-subjects" aria-controls="panel-admin-subjects" aria-selected="false" tabindex="-1" data-panel="subjects" data-text="web.subject.title"></button>
                    <button type="button" role="tab" id="tab-admin-users" aria-controls="panel-admin-users" aria-selected="false" tabindex="-1" data-panel="users" data-text="web.users.title"></button>
                    <button type="button" role="tab" id="tab-admin-audit" aria-controls="panel-admin-audit" aria-selected="false" tabindex="-1" data-panel="audit" data-text="web.audit.title"></button>
                </div>

                <div id="panel-admin-settings" role="tabpanel" aria-labelledby="tab-admin-settings" data-panel-group="admin" data-panel-name="settings">
                    <form id="settingsForm" class="settings-form">
                        <div class="section-tabs" role="tablist" data-tabs="settings">
                            <button type="button" role="tab" id="tab-settings-general" aria-controls="panel-settings-general" aria-selected="true" tabindex="0" data-panel="general" data-text="web.tabs.general"></button>
                            <button type="button" role="tab" id="tab-settings-backup" aria-controls="panel-settings-backup" aria-selected="false" tabindex="-1" data-panel="backup" data-text="web.tabs.backup"></button>
