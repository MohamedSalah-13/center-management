name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # جافا 21: المشروع يستعمل مزايا اللغة الحديثة (records، switch expressions، pattern matching)
      # وpom الأب يضبط java.version على 21، ومنها يضبط Spring Boot compiler release
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # لا -o هنا خلافاً للأمر المكتوب في CLAUDE.md:
      # وضع عدم الاتصال يعمل على جهاز المطوّر لأن كل شيء مخزَّن في ~/.m2،
      # أما هنا فالكاش فارغ في أول تشغيل وبعد كل تغيير في pom، فيفشل البناء فوراً.
      #
      # أغلب الاختبارات تستعمل H2 في الذاكرة. اختبار MySqlMigrationIntegrationTest وحده
      # يشغّل حاوية MySQL 8 عبر Docker المتاح في GitHub runner، ثم يطبق Flyway ويفحص القيود.
      # ولا تحتاج شاشة كذلك: لا اختبار يُقلع منصة JavaFX.
      - name: Run tests
        run: mvn --batch-mode clean test

      # disabledWithoutDocker يسمح للمطوّر بتشغيل الاختبارات العادية بلا Docker، لكنه لا يجوز
      # أن يحوّل بوابات MySQL في CI إلى نجاح صامت. هنا يجب أن تكون قد نُفّذت فعلاً.
      #
      # اثنتان: الأولى تثبت أن ملفات الترحيل تبني قاعدةً يوافق عليها Hibernate، والثانية
      # تثبت عزل المؤسسات - وهو معيار انتهاء المرحلة 2 ولا يُفحص على H2 أصلاً.
      - name: Require MySQL integration gates
        run: |
          for suite in \
            com.codejava.center.MySqlMigrationIntegrationTest \
            com.codejava.center.tenancy.MultiTenantIsolationIntegrationTest
          do
            report="center-app/target/surefire-reports/TEST-$suite.xml"
            test -f "$report"
            ! grep -Eq 'skipped="[1-9][0-9]*"' "$report"
          done

      # تقارير surefire هي الموضع الوحيد الذي يحمل رسالة الفشل كاملة،
      # وسجل الخطوة يقتصر على أسماء الاختبارات الفاشلة
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          # الوحدات الأربع: فشل في وحدة بلا تقرير مرفوع لا يُقرأ منه إلا الاسم
          path: |
            center-core/target/surefire-reports/
            center-app/target/surefire-reports/
            center-desktop/target/surefire-reports/
            center-web/target/surefire-reports/
          retention-days: 7
