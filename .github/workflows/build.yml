name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # جافا 21: المشروع يستعمل مزايا اللغة الحديثة (records، switch expressions، pattern matching)
      # وpom يضبط maven.compiler.source/target على 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # لا -o هنا خلافاً للأمر المكتوب في CLAUDE.md:
      # وضع عدم الاتصال يعمل على جهاز المطوّر لأن كل شيء مخزَّن في ~/.m2،
      # أما هنا فالكاش فارغ في أول تشغيل وبعد كل تغيير في pom، فيفشل البناء فوراً.
      #
      # أغلب الاختبارات تستعمل H2 في الذاكرة. اختبار MySqlMigrationIntegrationTest وحده
      # يشغّل حاوية MySQL 8 عبر Docker المتاح في GitHub runner، ثم يطبق Flyway ويفحص القيود.
      # ولا تحتاج شاشة كذلك: لا اختبار يُقلع منصة JavaFX.
      - name: Run tests
        run: mvn --batch-mode clean test

      # disabledWithoutDocker يسمح للمطوّر بتشغيل الاختبارات العادية بلا Docker، لكنه لا يجوز
      # أن يحوّل بوابة MySQL في CI إلى نجاح صامت. هنا يجب أن يكون الاختبار قد نُفّذ فعلاً.
      - name: Require MySQL migration gate
        run: |
          report=target/surefire-reports/TEST-com.codejava.center.MySqlMigrationIntegrationTest.xml
          test -f "$report"
          ! grep -Eq 'skipped="[1-9][0-9]*"' "$report"

      # تقارير surefire هي الموضع الوحيد الذي يحمل رسالة الفشل كاملة،
      # وسجل الخطوة يقتصر على أسماء الاختبارات الفاشلة
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
