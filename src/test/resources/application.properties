# إعدادات الاختبارات فقط: قاعدة H2 في الذاكرة بدلاً من MySQL
# تتجاوز إعدادات application.properties الرئيسية حتى لا تلمس الاختبارات قاعدة بيانات حقيقية
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway معطّلة في الاختبارات: ملفات الترحيل مكتوبة بلهجة MySQL ولا تعمل على H2.
# المخطط هنا يبنيه Hibernate من الكيانات، وهو نفسه مصدر ملف الترحيل الأول.
spring.jpa.show-sql=false

spring.flyway.enabled=false
