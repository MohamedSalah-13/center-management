# إعدادات MySQL
# القيم تُقرأ من متغيرات البيئة. لا تضع كلمة المرور هنا إطلاقاً لأن هذا الملف متتبَّع في git.
# للتطوير المحلي: أنشئ ملف application-local.properties (مستثنى من git) أو صدّر المتغيرات:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/center_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:center_app}
spring.datasource.password=${DB_PASSWORD:}

# لإنشاء أو تحديث الجداول تلقائياً من الـ Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
