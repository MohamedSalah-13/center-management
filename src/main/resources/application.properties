# إعدادات MySQL
# القيم تُقرأ من متغيرات البيئة. لا تضع كلمة المرور هنا إطلاقاً لأن هذا الملف متتبَّع في git.
# للتطوير المحلي: أنشئ ملف application-local.properties (مستثنى من git) أو صدّر المتغيرات:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/center_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:center_app}
spring.datasource.password=${DB_PASSWORD:}

# المخطط تديره Flyway عبر ملفات الترحيل في db/migration.
# validate لا ينشئ ولا يعدّل شيئاً، بل يرفض بدء التشغيل إن اختلف المخطط عن
# الكيانات - فيظهر أي ترحيل ناقص فوراً بدل أن يتحوّل إلى خطأ غامض وقت الاستخدام.
spring.jpa.hibernate.ddl-auto=validate

# قاعدة بيانات قائمة أُنشئت قبل اعتماد Flyway تُعلَّم كأنها عند V1 دون إعادة إنشائها
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# مجلد أدوات MySQL (mysqldump و mysql) حين لا تكون ضمن PATH — وهو حال مثبِّت ويندوز
# الافتراضي. اتركه فارغاً لاستعمال PATH. مثال:
#   CENTER_BACKUP_MYSQL_BIN_DIR=C:\\Program Files\\MySQL\\MySQL Server 8.0\\bin
center.backup.mysql-bin-dir=${CENTER_BACKUP_MYSQL_BIN_DIR:}

# قناة إرسال إشعارات أولياء الأمور لم تعد هنا: كانت تُقرأ مرة عند الإقلاع فلا يملك
# السنتر تغييرها في نسخة jpackage. صارت في شاشة الإعدادات > الإشعارات، محفوظة في
# center_settings ومقروءة عند كل إرسال. راجع MessageSenderRouter.
