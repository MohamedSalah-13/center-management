alertType.SESSION_STARTING_SOON=اقتراب موعد حصة
alertType.SESSION_STARTING_SOON.desc=اقترب موعد مجموعة من مواعيد اليوم ولم تُفتح لها حصة بعد. ما دامت الحصة مغلقة تردّ البوابة كل طالب يمرّ عليها، فيقف الطابور عند الباب. يصمت التنبيه فور فتح الحصة، ويُفحص كل بضع دقائق لا مرة في اليوم.
alertType.SESSION_STARTING_SOON.threshold=نبّه قبل الموعد بـ (دقائق):

alertType.SESSION_ENDING_SOON=اقتراب انتهاء حصة مفتوحة
alertType.SESSION_ENDING_SOON.desc=حصة مفتوحة اقترب موعد انتهائها أو مضى وهي ما زالت مفتوحة. الحصة التي لا تُغلق تمنع فتح حصة جديدة للمجموعة غداً وتؤجّل صرف مستحقات معلمها. تنبيه واحد لكل حصة لا يتكرر؛ ومن تجاهله يلتقطه تنبيه "حصة نُسي إغلاقها" في فحص الصباح التالي.
alertType.SESSION_ENDING_SOON.threshold=نبّه قبل الانتهاء بـ (دقائق):

alert.message.SESSION_STARTING_SOON=مجموعة {0} موعدها اليوم الساعة {1} ولم تُفتح لها حصة بعد. افتح الحصة قبل وصول الطلاب إلى البوابة.
alert.message.SESSION_ENDING_SOON=حصة مجموعة {0} تنتهي الساعة {1} وما زالت مفتوحة. أغلقها بعد انتهائها ليمكن فتح حصة جديدة غداً ويدخل مستحق معلمها في قائمة الصرف.

