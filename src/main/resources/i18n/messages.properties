# =============================================================================
#  حزمة النصوص العربية - وهي حزمة الأساس (بلا لاحقة لغة).
#
#  كونها الأساس مقصود: أي مفتاح يُنسى في messages_en.properties يظهر بالعربية
#  بدل أن يرمي MissingResourceException ويُسقط الشاشة عند العميل.
#
#  عند إضافة مفتاح هنا يجب إضافته في الملف الإنجليزي أيضاً؛
#  اختبار MessageBundleParityTest يفشل إن اختلفت مجموعتا المفاتيح.
#
#  النصوص المستعملة مع I18n.format تخضع لقواعد MessageFormat:
#  {0} للوسائط، والعلامة ' يجب مضاعفتها '' إن وُجدت.
# =============================================================================

