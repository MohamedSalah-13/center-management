settings.printModeNote=Preview shows the document in a window before it reaches paper, the printer dialog is the usual operating-system window, and direct printing sends it immediately with no window at all — which suits cashier receipts, where the same printer is used all day.
settings.printSheetsDirect=Print sheets directly instead of opening a PDF
settings.printSheetsDirectNote=This covers the table-style sheets (the student enrolments sheet), not the setting above. Left unticked, the sheet opens in a PDF viewer for you to check and print from; ticked, it goes straight to the report printer chosen below with no window at all.
settings.printCenterHeader=Print the centre letterhead at the top of sheets
settings.printCenterHeaderNote=The logo sits on the right of the letterhead, the centre name and phone on the left, taken from the "Centre details" tab. Untick it when the paper loaded in the printer already carries the letterhead — the sheet then moves up into that space instead of leaving it blank.
settings.paperNote=Paper sizes are read from the selected printer itself, so a thermal printer offers its real roll sizes while an office printer offers A4 and A5. Separating reports from receipts lets one machine print reports on A4 and receipts on a thermal printer at the same time.
settings.printNote=These settings are stored for this machine only and are saved the moment you choose them; the Save button is not needed. A printer belongs to the machine rather than to the centre: the gate terminal may print on a small receipt printer while the office prints on A4.
