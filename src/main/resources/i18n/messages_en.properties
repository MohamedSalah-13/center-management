# ------------------------------------------------- Session timing alerts
alertType.SESSION_STARTING_SOON=Session about to start
alertType.SESSION_STARTING_SOON.desc=A group is due to meet shortly and no session has been opened for it. While the session is closed the gate turns away every student who scans, so the queue backs up at the door. The alert goes quiet the moment the session is opened, and it is checked every few minutes rather than once a day.
alertType.SESSION_STARTING_SOON.threshold=Warn this many minutes before:

alertType.SESSION_ENDING_SOON=Open session about to end
alertType.SESSION_ENDING_SOON.desc=An open session is near its end time, or past it and still open. A session that is never closed blocks opening a new one for the group tomorrow and holds up its teacher payout. One alert per session, never repeated; if it is ignored, the "session left open" alert picks it up in the next morning scan.
alertType.SESSION_ENDING_SOON.threshold=Warn this many minutes before:

alert.message.SESSION_STARTING_SOON=Group {0} is due at {1} today and no session has been opened for it. Open the session before the students reach the gate.
alert.message.SESSION_ENDING_SOON=The session for group {0} ends at {1} and is still open. Close it once it finishes so a new session can be opened tomorrow and the teacher payout is released.
