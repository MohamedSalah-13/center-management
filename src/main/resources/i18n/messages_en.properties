# =============================================================================
#  English UI strings.
#
#  The Arabic bundle (messages.properties) is the base, so a key missing here
#  falls back to Arabic instead of throwing MissingResourceException at the
#  customer site. MessageBundleParityTest fails when the two key sets diverge,
#  so a forgotten key is caught by the build rather than by a user.
#
#  Apostrophes are deliberately avoided throughout ("cannot", "does not"):
#  MessageFormat treats a single quote as an escape character, and a value that
#  is safe today can be passed to I18n.format tomorrow.
# =============================================================================

# ------------------------------------------------------------------- general
app.title=Centre Management System

# Currencies: the full name for the picker, and the symbol appended to amounts.
# The currency is the centre's choice (Settings) while the language is the machine's,
# so these keys carry nothing but wording: the same currency reads "EGP" here and
# "ج.م" on an Arabic terminal at the same moment.
# The English symbol is the ISO code, not the sign: "$" alone belongs to more than
# twenty countries, and a printed receipt that does not say which dollar it means
# tells its reader nothing a year later.
