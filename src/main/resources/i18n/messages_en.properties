settings.notif.cloudNote=Official WhatsApp accepts free-form text only within 24 hours of the parent's last message to the centre, and absence or arrears notifications start from the centre, so they are almost always outside that window. Set an approved template whose body holds a single parameter {{1}}, into which the whole notification text is placed. Leave it empty and the message is sent as free text — useful for testing and for replying to someone who has just written to the centre.
settings.notif.gatewayNote=The request template is filled in before sending: {phone} the international number, {message} the message text, {sender} the sender ID, and {token} the access token. A template starting with {"..." is sent as JSON, anything else as an encoded form. If {token} is not mentioned in the template, it is sent in the Authorization header instead.
