settings.fontSize=Interface font size:
settings.fontSizeNote=The size is stored for this machine only, like the language, so a large reception screen and the manager's laptop need not agree. It takes effect as soon as you choose it, with no save, and can be changed from any screen with Ctrl plus + or -, and reset with Ctrl plus 0. Printouts are unaffected: they are sized for the paper, not for the screen.

