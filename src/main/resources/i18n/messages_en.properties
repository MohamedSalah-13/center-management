# --------------------------------------------------------- Alert types
alertType.ABSENCE=Student absence
alertType.ABSENCE.desc=Flags a student who missed a number of their group sessions during the period. Absence is counted against sessions actually held, so a group that held none counts nothing against its students.
alertType.ABSENCE.threshold=Absences needed to raise an alert:
alertType.ABSENCE.window=Length of the period checked (days):

alertType.STUDENT_INACTIVE=Student dropped off
alertType.STUDENT_INACTIVE.desc=A student with a live enrolment who has not been marked present anywhere in the centre for the given period. Not the same as absence: this is a complete disappearance, not missed sessions.
alertType.STUDENT_INACTIVE.window=Period with no attendance (days):

alertType.ARREARS=Student arrears
alertType.ARREARS.desc=A student whose balance is negative by more than the limit. The limit keeps rounding differences, and a session charged minutes before its payment, out of the alert.
alertType.ARREARS.threshold=Smallest amount due worth an alert ({0}):

alertType.LOW_BALANCE=Balance running out
alertType.LOW_BALANCE.desc=The student balance is still positive but close to empty. The alert arrives before the gate turns them away at the classroom door with the session about to start.
alertType.LOW_BALANCE.threshold=Balance below which the alert starts ({0}):

alertType.PAYMENT_RECEIPT=Payment receipt
alertType.PAYMENT_RECEIPT.desc=Raised the moment a payment is taken at the cashier, not in the daily scan. Its natural audience is the parent: confirmation that what they sent arrived, and the balance after it.

alertType.TEACHER_DUES_PENDING=Unpaid teacher dues
alertType.TEACHER_DUES_PENDING.desc=A teacher with closed sessions whose dues have not been paid out: either the count reached the limit, or one of them is older than the given period.
alertType.TEACHER_DUES_PENDING.threshold=Session count worth an alert:
alertType.TEACHER_DUES_PENDING.window=Age of the oldest session worth an alert (days):

alertType.SESSION_LEFT_OPEN=Session left open
alertType.SESSION_LEFT_OPEN.desc=A session still open after its day has passed. It blocks opening a new session for the same group, and holds up its teacher payout until it is closed.
alertType.SESSION_LEFT_OPEN.window=Days before it counts as forgotten:

alertType.GROUP_WITHOUT_SESSION=Dormant group
alertType.GROUP_WITHOUT_SESSION.desc=A live group with no session held for the given period. Nothing else surfaces it, because absence is only counted against sessions that were actually held.
alertType.GROUP_WITHOUT_SESSION.window=Period with no sessions (days):

alertType.BACKUP_FAILED=Backup failed
alertType.BACKUP_FAILED.desc=Raised the moment an automatic backup attempt fails. The detailed reason is in the application log; this alert is what makes sure somebody knows.

alertType.BACKUP_OVERDUE=Backup overdue
alertType.BACKUP_OVERDUE.desc=More time has passed since the last successful backup than allowed. Worse than a failed backup: when no attempt runs at all there is no failure to report, and everything looks fine until the day the backup is needed.
alertType.BACKUP_OVERDUE.window=Time allowed without a backup (days):

alertType.FAILED_LOGIN_BURST=Failed sign-in attempts
alertType.FAILED_LOGIN_BURST.desc=Failed sign-in attempts passed the limit during the period. The names and times are in the audit trail.
alertType.FAILED_LOGIN_BURST.threshold=Number of failed attempts:
alertType.FAILED_LOGIN_BURST.window=Within how many days:

alertType.MESSAGING_CHANNEL_DOWN=Messaging channel down
alertType.MESSAGING_CHANNEL_DOWN.desc=The messaging channel is not ready while a rule that sends to parents is switched on. It stays quiet if the centre does not message parents at all.

# ------------------------------------------------- Alert text in the inbox
# The detector arguments in order, and the CURRENCY SYMBOL always last, inserted by
# Alert.describe: amounts are stored as bare numbers (a stored symbol would freeze on
# the currency and language of the day it was written) and the symbol is read from the
# centre currency at display time. A type that mentions no money simply ignores it.
alert.message.ABSENCE={0} missed {1} of {2} sessions in group {3}.
alert.message.STUDENT_INACTIVE={0} has not attended a single session for {1} days, although the enrolment is still live.
alert.message.ARREARS={0} owes {1} {2}.
alert.message.LOW_BALANCE=The balance of {0} is running out: {1} {2}.
alert.message.PAYMENT_RECEIPT=Received {1} {3} from {0}; the balance after it is {2} {3}.
alert.message.TEACHER_DUES_PENDING={0} has {1} closed sessions whose dues have not been paid out.
alert.message.SESSION_LEFT_OPEN=The session for group {0} on {1} is still open. Close it so a new session can be opened and the teacher paid.
alert.message.GROUP_WITHOUT_SESSION=Group {0} has held no session for {1} days.
alert.message.BACKUP_FAILED=The automatic backup failed on {0}. Check the application log and the backup folder.
alert.message.BACKUP_OVERDUE=Last successful backup: {0}. Check the backup settings now.
alert.message.FAILED_LOGIN_BURST={0} failed sign-in attempts in {1} days. Check the audit trail for the names and times.
alert.message.MESSAGING_CHANNEL_DOWN=The messaging channel is not ready while alerts are set to reach parents. Configure it under Settings > Notifications.

# ------------------------------------------------- Text sent to parents
# Argument {0} is always the centre name, then the alert arguments in order,
# and the currency symbol last
alert.parentMessage.ABSENCE=Dear parent, {0} informs you that the student {1} was absent from {2} of {3} sessions in group {4}. Please follow up. Thank you for your cooperation.
alert.parentMessage.ARREARS=Dear parent, {0} informs you that the student {1} has outstanding fees of {2} {3}. Please settle them so attendance can continue. Thank you for your cooperation.
alert.parentMessage.LOW_BALANCE=Dear parent, {0} informs you that the balance of the student {1} is running out ({2} {3}). Please top it up before the next session. Thank you for your cooperation.
alert.parentMessage.PAYMENT_RECEIPT=Dear parent, {0} confirms receipt of {2} {4} from the student {1}. Balance after payment: {3} {4}. Thank you for your cooperation.

